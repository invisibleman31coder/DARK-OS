name: Build ZED-OS

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-multilib make
      - name: Build
        run: make clean && make
      - name: Check image
        run: ls -lh ZED-OS.img && echo "Build OK - ZED-OS v2.4"
